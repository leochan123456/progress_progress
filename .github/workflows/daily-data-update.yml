name: Daily Polymarket data update

on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-polymarket-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade numpy pandas scipy scikit-learn statsmodels pypdf

      - name: Refresh Polymarket data
        run: python "ISOM 3360/polymarket_hk_temp_scraper.py"

      - name: Clean Polymarket data
        run: python "ISOM 3360/clean_pm_data.py"

      - name: Commit changed PM files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "ISOM 3360/Storage/PM"
          if [[ -n "$(git status --porcelain)" ]]; then
            git commit -m "Update Polymarket data $(date -u +%F)"
            git push origin main
          else
            echo "No Polymarket changes to commit."
          fi
